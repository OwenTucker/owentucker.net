<header class="site-header">
  <nav class="wrap nav">
    <a class="nav-home{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <ul class="nav-links">
      {% for item in site.nav %}
      <li><a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="active"{% endif %}>{{ item.title }}{% if item.badge %} <span class="badge">({{ item.badge }})</span>{% endif %}</a></li>
      {% endfor %}
    </ul>
    <ul class="nav-links nav-right">
      {% for item in site.nav_right %}
      <li><a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="active"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
